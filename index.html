<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>与脊柱的对话</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <!-- Layer 1: SVG/Canvas overlay — body silhouette for teaching segment -->
  <div id="svg-overlay" class="overlay-layer">
    <div id="body-container" class="body-container">
      <svg id="body-svg" viewBox="0 0 200 440" class="body-svg">
        <!-- Head -->
        <ellipse cx="100" cy="28" rx="15" ry="18" />
        <!-- Neck -->
        <line x1="100" y1="46" x2="100" y2="60" />
        <!-- Shoulders -->
        <path d="M 93 60 C 80 60, 55 72, 42 88" />
        <path d="M 107 60 C 120 60, 145 72, 158 88" />
        <!-- Arms -->
        <path d="M 42 88 Q 34 135, 30 185" />
        <path d="M 158 88 Q 166 135, 170 185" />
        <!-- Torso left -->
        <path d="M 52 88 C 54 135, 58 185, 62 235 Q 64 265, 73 295" />
        <!-- Torso right -->
        <path d="M 148 88 C 146 135, 142 185, 138 235 Q 136 265, 127 295" />
        <!-- Spine S-curve -->
        <path id="svg-spine" class="svg-spine"
              d="M 100 60 C 100 95, 113 140, 110 190 C 107 240, 92 275, 96 305"
              stroke-dasharray="4,4" />
        <!-- Pelvis -->
        <path d="M 73 295 Q 70 310, 73 320 L 82 340" />
        <path d="M 127 295 Q 130 310, 127 320 L 118 340" />
        <!-- Upper legs -->
        <line x1="82" y1="340" x2="78" y2="420" />
        <line x1="118" y1="340" x2="122" y2="420" />
      </svg>

      <!-- Glowing dot marking the convex side (right thoracic) -->
      <div id="glow-dot" class="glow-dot"></div>

      <!-- Arrow: concave → convex -->
      <svg id="arrow-svg" class="arrow-svg" viewBox="0 0 120 30">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7"
                  refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,180,100,0.85)" />
          </marker>
        </defs>
        <line x1="10" y1="15" x2="95" y2="15"
              stroke="rgba(255,180,100,0.85)" stroke-width="2"
              marker-end="url(#arrowhead)" />
      </svg>

      <!-- Single-side ribcage expansion -->
      <div id="chest-expand" class="chest-expand">
        <div class="rib-half"></div>
      </div>
    </div>
  </div>

  <!-- Layer 2: UI overlay — text, pacer, data -->
  <div id="ui-overlay" class="overlay-layer">
    <!-- IDLE state -->
    <div id="idle-ui" class="idle-ui">
      <h1 class="project-title">与脊柱的对话</h1>
      <p class="idle-hint">按下空格键开始体验</p>
      <div class="qr-area">
        <div class="qr-placeholder">QR</div>
        <p class="qr-hint">扫码上传 X 光片（可选）</p>
      </div>
    </div>

    <!-- Narration text (subtitle area) -->
    <div id="guide-text" class="guide-text"></div>

    <!-- Personal data display -->
    <div id="data-display" class="data-display">
      我的脊柱：胸椎右凸 <span class="hl-orange">28°</span> / 腰椎左凸 <span class="hl-cyan">18°</span>
    </div>

    <!-- Breathing pacer -->
    <div id="breathing-pacer" class="breathing-pacer">
      <div class="pacer-ring" id="pacer-ring"></div>
      <div class="pacer-label" id="pacer-label"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
