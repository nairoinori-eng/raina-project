<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spine Particle Visualization</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Debug Panel -->
  <div id="debug-panel">
    <h3>调试面板</h3>
    <div>
      <span>当前阶段：</span>
      <span id="dbg-phase">IDLE</span>
    </div>
    <div>
      <span>Blend 值：</span>
      <span id="dbg-blend">0.00</span>
    </div>
    <div>
      <label>拖动模拟呼吸（0~1）</label>
      <input type="range" id="blend-slider" min="0" max="1" step="0.01" value="0" />
    </div>
    <div class="hint">
      <span>&larr; 左 = 脊柱弯曲（冷蓝紫）</span><br/>
      <span>右 = 脊柱变直（暖金）&rarr;</span>
    </div>
    <div class="actions">
      <button id="btn-start">&#9654; 开始体验</button>
      <button id="btn-reset">&#8635; 重置</button>
    </div>
    <div class="hint">
      键盘快捷键：D = 隐藏面板
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
