<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAINA — 脊柱侧弯交互装置</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ① Three.js 渲染画布（全屏，最底层） -->
  <canvas id="spine-canvas"></canvas>

  <!-- BGM 音频（loop 循环，preload 提前加载，默认暂停） -->
  <audio id="bgm" src="audio/bgm.mp3" loop preload="auto"></audio>

  <!-- ② HTML 叠加层：用来显示引导文字、状态提示等 -->
  <div id="overlay">
    <!-- 文字内容由 app.js 动态写入 -->
  </div>

  <!-- ②a EXPERIENCE 呼吸提示（吸气 1 2 / 屏息 1 2 / 呼气 1 2 / 放松 1 2） -->
  <div id="breath-overlay">
    <div id="breath-mini-ring"></div>
    <p id="breath-label">
      <span id="breath-phase"></span>
      <span id="breath-c1">1</span>
      <span id="breath-c2">2</span>
    </p>
  </div>

  <!-- ③ 调试面板（开发时用，正式展览前用 D 键隐藏或直接删掉这段） -->
  <div id="debug-panel">
    <h3>🛠 调试面板</h3>

    <div class="debug-row">
      <span>当前阶段：</span>
      <span id="debug-state" class="debug-value">IDLE</span>
    </div>

    <div class="debug-row">
      <span>Blend 值：</span>
      <span id="debug-blend" class="debug-value">0.00</span>
    </div>

    <div class="debug-row">
      <span>FPS：</span>
      <span id="debug-fps" class="debug-value">--</span>
    </div>

    <div class="debug-row">
      <span>粒子数：</span>
      <span id="debug-particles" class="debug-value">--</span>
    </div>

    <div class="debug-section">
      <label for="blend-slider">Blend 调节：</label>
      <input type="range" id="blend-slider" min="0" max="100" value="0" />
    </div>

    <div class="debug-section">
      <label for="guide-progress-slider">引导进度 (<span id="guide-progress-val">0</span>s / 72s)：</label>
      <input type="range" id="guide-progress-slider" min="0" max="72" value="0" step="0.5" />
    </div>

    <div class="debug-section">
      <label for="pixel-ratio-slider">高清粒子精度 (<span id="pixel-ratio-val">4.0</span>)：</label>
      <input type="range" id="pixel-ratio-slider" min="10" max="40" value="40" />
      <label for="bloom-slider">边缘物理泛光 (<span id="bloom-val">1.30</span>)：</label>
      <input type="range" id="bloom-slider" min="0" max="200" value="130" />
      <label for="exposure-slider">电影级曝光率 (<span id="exposure-val">1.30</span>)：</label>
      <input type="range" id="exposure-slider" min="20" max="300" value="130" />
    </div>

    <div class="debug-section">
      <button id="btn-start">▶ 按钮：开始体验</button>
      <button id="btn-skip">⏩ 跳过引导</button>
      <button id="btn-summary">✦ 结算页预览</button>
      <button id="btn-pause">⏸ 暂停动画</button>
      <button id="btn-reset">↺ 按钮：重置</button>
      <button id="btn-voice">🎙 开启语音聆听</button>
    </div>

    <p class="debug-hint">键盘快捷键：D = 隐藏/显示此面板 | F = 全屏 | Space = 开始 / P = 暂停</p>
  </div>

  <!-- ④ Vignette 暗角（CSS 径向遮罩，边缘渐暗） -->
  <div id="vignette"></div>

  <!-- ⑤ BGM 控制按钮（右下角，扬声器+三角=暂停态，扬声器+声波=播放态） -->
  <button id="bgm-toggle" type="button" aria-label="播放/暂停背景音乐">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <!-- 扬声器主体 -->
      <path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/>
      <!-- 暂停态：小播放三角 -->
      <path class="bgm-icon-paused" d="M15 9 L19 12 L15 15 Z" fill="currentColor"/>
      <!-- 播放态：三道声波 -->
      <g class="bgm-icon-playing" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path class="bgm-wave bgm-wave-1" d="M15 9 Q17 12 15 15"/>
        <path class="bgm-wave bgm-wave-2" d="M17 7 Q20 12 17 17"/>
        <path class="bgm-wave bgm-wave-3" d="M19 5 Q22.5 12 19 19"/>
      </g>
    </svg>
  </button>

  <!-- Three.js 主程序（Vite 会处理模块导入） -->
  <script type="module" src="/app.js"></script>

</body>
</html>
