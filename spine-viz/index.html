<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAINA — 脊柱侧弯交互装置</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ① Three.js 渲染画布（全屏，最底层） -->
  <canvas id="spine-canvas"></canvas>

  <!-- ② HTML 叠加层：用来显示引导文字、状态提示等 -->
  <div id="overlay">
    <!-- 文字内容由 main.js 动态写入 -->
  </div>

  <!-- ③ 调试面板（开发时用，正式展览前用 D 键隐藏或直接删掉这段） -->
  <div id="debug-panel">
    <h3>🛠 调试面板</h3>

    <div class="debug-row">
      <span>当前阶段：</span>
      <span id="debug-state" class="debug-value">IDLE</span>
    </div>

    <div class="debug-row">
      <span>Blend 值：</span>
      <span id="debug-blend" class="debug-value">0.00</span>
    </div>

    <div class="debug-row">
      <span>FPS：</span>
      <span id="debug-fps" class="debug-value">--</span>
    </div>

    <div class="debug-row">
      <span>粒子数：</span>
      <span id="debug-particles" class="debug-value">--</span>
    </div>

    <div class="debug-section">
      <label for="blend-slider">拖动模拟呼吸（硬件到货前用这个）：</label>
      <input type="range" id="blend-slider" min="0" max="100" value="0" />
      <p class="debug-hint">← 左边 = 脊柱弯曲（蓝紫）　右边 = 脊柱变直（暖金）</p>
    </div>

    <div class="debug-section">
      <label for="guide-progress-slider">引导进度 (<span id="guide-progress-val">0</span>s / 86s)：</label>
      <input type="range" id="guide-progress-slider" min="0" max="86" value="0" step="0.5" />
      <label for="guide-speed-slider">引导速度 (<span id="guide-speed-val">3.0</span>x)：</label>
      <input type="range" id="guide-speed-slider" min="10" max="100" value="30" />
    </div>

    <div class="debug-section">
      <label for="pixel-ratio-slider">高清粒子精度 (<span id="pixel-ratio-val">3.0</span>)：</label>
      <input type="range" id="pixel-ratio-slider" min="10" max="40" value="30" />
      <label for="bloom-slider">边缘物理泛光 (<span id="bloom-val">0.12</span>)：</label>
      <input type="range" id="bloom-slider" min="0" max="200" value="12" />
      <label for="exposure-slider">电影级曝光率 (<span id="exposure-val">1.00</span>)：</label>
      <input type="range" id="exposure-slider" min="20" max="300" value="100" />
    </div>

    <div class="debug-section">
      <button id="btn-start">▶ 按钮：开始体验</button>
      <button id="btn-skip">⏩ 跳过引导</button>
      <button id="btn-reset">↺ 按钮：重置</button>
    </div>

    <p class="debug-hint">键盘快捷键：D = 隐藏/显示此面板 | F = 全屏</p>
  </div>

  <!-- ④ Vignette 暗角（CSS 径向遮罩，边缘渐暗） -->
  <div id="vignette"></div>

  <!-- Three.js 主程序（Vite 会处理模块导入） -->
  <script type="module" src="/app.js"></script>

</body>
</html>
