<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>花朵 3 态预览</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; text-align: center; margin: 20px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  .row { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
  .card { text-align: center; }
  .card h2 { font-size: 16px; margin: 8px 0; }
  .card p { font-size: 12px; color: #888; margin: 4px 0; }
  img { border: 1px solid #333; border-radius: 8px; }
  .legend { margin-top: 20px; font-size: 13px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <h1>花朵粒子 3 态 Morphing 预览（占位模板）</h1>
  <div class="row">
    <div class="card">
      <h2>花苞 Bud</h2>
      <p>blend < 0.55 · 紧闭</p>
      <img src="flowers/preview-bud.svg" width="300" height="300">
    </div>
    <div class="card">
      <h2>半开 Half</h2>
      <p>外层展开 · 内层半卷</p>
      <img src="flowers/preview-half.svg" width="300" height="300">
    </div>
    <div class="card">
      <h2>全开 Bloom</h2>
      <p>blend → 1.0 · 完全绽放</p>
      <img src="flowers/preview-bloom.svg" width="300" height="300">
    </div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#e85050"></span> 瓣0（底层）</span>
    <span><span class="dot" style="background:#e8a050"></span> 瓣1</span>
    <span><span class="dot" style="background:#e8e050"></span> 瓣2</span>
    <span><span class="dot" style="background:#50b8e8"></span> 瓣3</span>
    <span><span class="dot" style="background:#a050e8"></span> 瓣4（顶层）</span>
    <span><span class="dot" style="background:#f0d040"></span> 花蕊</span>
  </div>
  <p style="margin-top:16px;color:#666;font-size:12px">每个点 = 1 个粒子（共 500），实际渲染时粒子更大、有辉光和颜色过渡</p>
</body>
</html>
