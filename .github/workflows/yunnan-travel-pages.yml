name: Deploy Yunnan Travel Guide

on:
  push:
    branches: [main]
    paths:
      - "travel-2026-yunnan/**"
      - ".github/workflows/yunnan-travel-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload travel guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: travel-2026-yunnan
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
